name: Eval Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install traceback-ai
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run Demo Pipeline Evaluation Gate
        run: |
          traceback run examples/simple_rag.py --input examples/test_cases.json --fail-on-blame 0.7
