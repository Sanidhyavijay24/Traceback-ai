[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-blame"
version = "0.1.1"
description = "LLM agent execution tracer with failure attribution"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llm", "ai", "tracing", "eval", "observability", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "click>=8.0",
    "tiktoken>=0.5",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=2.2"]
gemini = ["google-genai>=0.1.0"]
anthropic = ["anthropic>=0.20"]
openai = ["openai>=1.0"]
langchain = ["langchain>=0.1"]
dev = ["pytest", "pytest-cov", "ruff", "black", "build", "twine", "numpy>=1.24.0"]
all = ["agent-blame[semantic,gemini,anthropic,openai,langchain]"]

[tool.hatch.build.targets.wheel]
packages = ["src/tracebackai"]

[project.scripts]
traceback = "tracebackai.cli:cli"
tb = "tracebackai.cli:cli"

[project.urls]
Homepage = "https://github.com/Sanidhyavijay24/traceback-ai"
Issues = "https://github.com/Sanidhyavijay24/traceback-ai/issues"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
